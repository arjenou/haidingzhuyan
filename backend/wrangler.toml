name = "haidingzhuyan-api"
main = "src/index.ts"
compatibility_date = "2023-12-01"

# 自定义域名路由
routes = [
  { pattern = "api.castoneeic.com/*", zone_name = "castoneeic.com" }
]

# R2 存储桶配置
[[r2_buckets]]
binding = 'R2_BUCKET'
bucket_name = 'haidingzhuyan'
preview_bucket_name = 'haidingzhuyan'

# KV 命名空间配置
[[kv_namespaces]]
binding = "POSTER_METADATA"
id = "566eea77808f41728aaacd5b3d3bc0bd"

[site]
bucket = "./public"

# 配置环境变量
[vars]
R2_ENDPOINT = "https://2e9ce2c37b30771ddabc7503e02c4c3.r2.cloudflarestorage.com" 
# 统一后台的 D1，PDF 数据从这里读（只读）
[[d1_databases]]
binding = "DB"
database_name = "capstone"
database_id = "b9037d6c-b287-4086-b779-794c916a0830"
